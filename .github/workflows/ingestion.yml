name: Ingestion API CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "services/ingestion/**"
      - "services/common/**"
      - "Dockerfile.ingestion"
      - ".github/workflows/ingestion.yml"

env:
  PROJECT_ID: billsight-ai-project
  REGION: asia-south1
  ZONE: asia-south1-a
  REPO: billsight-repo
  IMAGE_NAME: ingestion
  CLUSTER: billsight-gke-cluster
  DEPLOYMENT_NAME: ingestion

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@v4

    - name: Debug GitHub OIDC claims
      run: |
        echo "Repository: $GITHUB_REPOSITORY"
        echo "Actor: $GITHUB_ACTOR"
        echo "Ref: $GITHUB_REF"

    - name: Auth to GCP
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: projects/702359347960/locations/global/workloadIdentityPools/github-pool/providers/github
        service_account: cicd-gsa@billsight-ai-project.iam.gserviceaccount.com

    - uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker
      run: gcloud auth configure-docker ${REGION}-docker.pkg.dev

    - name: Build API image
      run: |
        docker build \
          -f Dockerfile.ingestion \
          -t ${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/${IMAGE_NAME}:${GITHUB_SHA} \
          .

    - name: Push API image
      run: |
        docker push ${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/${IMAGE_NAME}:${GITHUB_SHA}

    - name: Get GKE creds
      run: |
        gcloud container clusters get-credentials ${CLUSTER} \
          --zone ${ZONE} \
          --project ${PROJECT_ID}

    - name: Deploy API
      run: |
        kubectl set image deployment/${DEPLOYMENT_NAME} \
          ${IMAGE_NAME}=${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/${IMAGE_NAME}:${GITHUB_SHA}
          -n default
        kubectl rollout status deployment/${DEPLOYMENT_NAME}

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: projects/702359347960/locations/global/workloadIdentityPools/github-pool/providers/github
        service_account: cicd-gsa@billsight-ai-project.iam.gserviceaccount.com

    - name: Verify identity
      run: |
        gcloud auth list
        gcloud config list