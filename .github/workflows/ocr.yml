name: OCR Worker CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "services/ocr/**"
      - "services/common/**"
      - "Dockerfile.ocr"
      - ".github/workflows/ocr.yml"
    

env:
  PROJECT_ID: billsight-ai-project
  REGION: asia-south1
  REPO: billsight-repo
  IMAGE_NAME: ocr-worker
  CLUSTER: billsight-gke-cluster
  ZONE: asia-south1-a
  DEPLOYMENT_NAME: ocr-worker

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@v4

    - name: Auth to GCP
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: projects/XXXX/locations/global/workloadIdentityPools/github-pool/providers/github
        service_account: github-ci@billsight-ai-project.iam.gserviceaccount.com

    - uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker
      run: gcloud auth configure-docker ${REGION}-docker.pkg.dev

    - name: Build Worker image
      run: |
        docker build \
          -t ${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/${IMAGE_NAME}:${GITHUB_SHA} \
          ocr-worker/

    - name: Push Worker image
      run: |
        docker push ${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/${IMAGE_NAME}:${GITHUB_SHA}

    - name: Get GKE creds
      run: |
        gcloud container clusters get-credentials ${CLUSTER} \
          --zone ${ZONE} \
          --project ${PROJECT_ID}

    - name: Deploy Worker
      run: |
        kubectl set image deployment/${DEPLOYMENT_NAME} \
          ${IMAGE_NAME}=${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/${IMAGE_NAME}:${GITHUB_SHA}
          -n default
        kubectl rollout status deployment/${DEPLOYMENT_NAME}