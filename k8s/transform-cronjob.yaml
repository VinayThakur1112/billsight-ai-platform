apiVersion: batch/v1
kind: CronJob
metadata:
  name: transform-batch-processor
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2

  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: postprocess-ksa
          restartPolicy: Never

          containers:
          - name: postprocess-ksa
            image: asia-south1-docker.pkg.dev/billsight-ai-project/billsight-repo/transform:v5
            resources:
              requests:
                cpu: "10m"
                memory: "96Mi"
              limits:
                cpu: "50m"
                memory: "256Mi"
            command: ["python", "-m", "services.transform.main"]
            envFrom:
            - configMapRef:
                name: app-config-v1