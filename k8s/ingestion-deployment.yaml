apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingestion
  template:
    metadata:
      labels:
        app: ingestion
    spec:
      serviceAccountName: ingestion-ksa
      containers:
      - name: ingestion
        image: asia-south1-docker.pkg.dev/billsight-ai-project/billsight-repo/ingestion:v1
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: app-config-v1